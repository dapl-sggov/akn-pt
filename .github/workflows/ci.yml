name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  schema-tests:
    name: Schema test suite (XSD + Schematron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install lxml
        run: pip install lxml
      - name: Run schema tests (42 cases)
        run: python schema/tests/run_tests.py

  corpus-validation:
    name: Corpus validation (10 real diplomas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install lxml
        run: pip install lxml
      - name: Validate corpus
        run: python corpus/validate_corpus.py

  validator-tests:
    name: Validator unit + integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python-version }} }
      - name: Install validator with dev deps
        working-directory: validator
        run: pip install -e .[dev]
      - name: Run pytest
        working-directory: validator
        run: pytest -ra -q

  eli-pt-conversion:
    name: ELI-PT conversion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install pytest
        run: pip install pytest
      - name: Run ELI-PT tests (13 cases)
        run: pytest eli-pt/tests/ -ra -q

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t akn-pt:ci -f validator/Dockerfile validator/
      - name: Smoke test
        run: docker run --rm akn-pt:ci --version

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        working-directory: validator
        run: ruff check src tests

  editor-smoke:
    name: Editor — smoke test (16 cenários) + AKN-PT batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install validator
        run: pip install -e ./validator
      - name: Run editor smoke (gera 16 ficheiros)
        run: node editor/smoke-test.js
      - name: Validar todos via akn-pt batch (15 esperado OK)
        run: python -m akn_pt batch editor/.smoke-output

  editor-ui:
    name: Editor — testes de UI (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install jsdom
        run: npm install jsdom@24
      - name: Run UI integration test
        run: |
          cat > /tmp/test-editor-ui.js <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { JSDOM } = require('jsdom');
          const ROOT = path.resolve('editor');
          const html = fs.readFileSync(path.join(ROOT, 'index.html'), 'utf8');
          const dom = new JSDOM(html, { runScripts: 'outside-only', url: 'http://localhost/' });
          const { window } = dom;
          const errors = [];
          window.addEventListener('error', (e) => errors.push(e.message));
          window.console = console;
          window.confirm = () => true;
          window.prompt = (m, d) => d || 'TEST';
          window.alert = () => {};
          if (typeof window.BroadcastChannel === 'undefined') {
            window.BroadcastChannel = class { postMessage(){} close(){} };
          }
          const files = html.match(/src="js\/[^"]+"/g).map(s => s.replace(/src="js\/|"/g, ''));
          const combined = files.map(f => fs.readFileSync(path.join(ROOT, 'js', f), 'utf8')).join('\n\n');
          window.eval(combined);
          window.document.dispatchEvent(new window.Event('DOMContentLoaded'));
          setTimeout(() => {
            const $ = sel => window.document.querySelector(sel);
            const $$ = sel => [...window.document.querySelectorAll(sel)];
            const checks = [];
            checks.push(['landing cards', $$('.type-card').length === 9]);
            $$('.type-card').find(c => c.textContent.includes('Decreto-Lei')).click();
            checks.push(['editor abre', window.State.get().body.items.length > 0]);
            const tabs = $$('.tab').map(t => t.dataset.tab);
            checks.push(['4 tabs', tabs.length === 4 && ['info','review','links','output'].every(t => tabs.includes(t))]);
            const trigger = $('[data-menu="export"] [data-menu-trigger]');
            trigger.click();
            checks.push(['menu abre', $$('[data-menu-panel].open').length === 1]);
            window.document.body.click();
            checks.push(['click outside fecha', $$('[data-menu-panel].open').length === 0]);
            trigger.click();
            window.document.dispatchEvent(new window.KeyboardEvent('keydown', { key: 'Escape' }));
            checks.push(['ESC fecha', $$('[data-menu-panel].open').length === 0]);
            let fails = 0;
            checks.forEach(([name, ok]) => {
              console.log((ok ? '✓' : '✗') + ' ' + name);
              if (!ok) fails++;
            });
            if (errors.length) {
              console.log('JS errors:'); errors.forEach(e => console.log('  ' + e));
              fails += errors.length;
            }
            process.exit(fails ? 1 : 0);
          }, 200);
          EOF
          node /tmp/test-editor-ui.js
