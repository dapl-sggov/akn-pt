name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  schema-sync:
    name: Schema sync check (schema/ vs validator/data/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check schemas in sync
        run: python tools/sync_schemas.py --check

  schema-tests:
    name: Schema test suite (XSD + Schematron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install lxml
        run: pip install lxml
      - name: Run schema tests (42 cases)
        run: python schema/tests/run_tests.py

  corpus-validation:
    name: Corpus validation (10 real diplomas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install lxml
        run: pip install lxml
      - name: Validate corpus
        run: python corpus/validate_corpus.py

  validator-tests:
    name: Validator unit + integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator with dev deps
        working-directory: validator
        run: pip install -e ".[dev]"
      - name: Run pytest
        working-directory: validator
        run: pytest -ra -q

  eli-pt-conversion:
    name: ELI-PT conversion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install pytest
        run: pip install pytest
      - name: Run ELI-PT tests (13 cases)
        run: pytest eli-pt/tests/ -ra -q

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t akn-pt:ci -f validator/Dockerfile validator/
      - name: Smoke test
        run: docker run --rm akn-pt:ci --version

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        working-directory: validator
        run: ruff check src tests

  editor-smoke:
    name: Editor — smoke test (19 cenários) + AKN-PT batch (18 OK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install validator
        run: pip install -e ./validator
      - name: "Run editor smoke (gera 19 ficheiros: 9 templates + 10 features)"
        run: node editor/smoke-test.js
      - name: Validar todos via akn-pt batch (18 esperado OK)
        run: python -m akn_pt batch editor/.smoke-output

  editor-ui:
    name: Editor — testes de UI (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dev deps (jsdom)
        run: npm install
      - name: Run UI integration test
        run: npm run test:ui
