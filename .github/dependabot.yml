version: 2
updates:
  # Python — validator/
  - package-ecosystem: "pip"
    directory: "/validator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "validator"

  # Node — root (editor smoke test depende de @xmldom/xmldom)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "editor"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"

  # Docker — validator/Dockerfile
  - package-ecosystem: "docker"
    directory: "/validator"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
